name: What's For Eats — daily Pinterest RSS pin creator
on:
  schedule:
    - cron: '7 7 * * *'
      timezone: 'America/Detroit'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-whatsforeats-pinterest
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate photo-led Pins and update RSS feed
        run: python scripts/pinterest_publisher.py
      - name: Commit public image assets and feed changes
        shell: bash
        run: |
          git config user.name 'Whats For Eats Pin Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pinterest-daily-pins pinterest-rss.xml
          if ! git diff --cached --quiet; then
            git commit -m "Daily original photo pins + RSS update $(TZ=America/Detroit date +%Y-%m-%d)"
            git push origin HEAD:main
          else
            echo 'Already generated today; no duplicate feed update.'
          fi
