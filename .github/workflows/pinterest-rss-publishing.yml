# Recovery check Oct 27: expose OpenAI 429 provider error details; do not retry quota failures blindly.
name: "What's For Eats — research-gated original Pinterest publisher"
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pinterest-rss-publishing.yml"
      - "pinterest-research/**/manifest.json"
  schedule:
    - cron: '15 8,9,10,11 * * *'
      timezone: 'America/Detroit'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-whatsforeats-pinterest
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout claimed website and today's research manifest
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image layout renderer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pymupdf==1.26.5
      - name: Validate research-led Pinterest image renderer syntax
        run: python -m py_compile scripts/pinterest_publisher.py
      - name: Create verified paid-image attempt reservation BEFORE any API calls
        env:
          OPENAI_IMAGE_MODEL: gpt-image-2
          OPENAI_IMAGE_QUALITY: high
        run: python scripts/pinterest_paid_generation_lock.py
      - name: Commit daily spending lock so retries cannot duplicate API charges
        shell: bash
        run: |
          git config user.name 'Whats For Eats Image Cost Guard'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pinterest-generation-attempts
          if ! git diff --cached --quiet; then
            git commit -m "Reserve single high-quality Pinterest image batch before API calls"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "::error::Cannot persist paid-attempt lock; refusing to call OpenAI API"
            exit 1
          fi
      - name: Generate nine BRAND NEW first-party AI food images ONLY AFTER today's archived research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2
          PINTEREST_POSTING_MODE: manual
          OPENAI_IMAGE_QUALITY: high
        run: python scripts/pinterest_publisher.py
      - name: Set Detroit asset date for recoverable upload
        id: asset_date
        run: echo "date=$(TZ=America/Detroit date +%F)" >> "$GITHUB_OUTPUT"
      - name: Preserve generated images and ledger before GitHub push
        uses: actions/upload-artifact@v4
        with:
          name: original-pinterest-pins-${{ steps.asset_date.outputs.date }}
          path: |
            pinterest-daily-pins/${{ steps.asset_date.outputs.date }}/
            pinterest-publishing-ledger/${{ steps.asset_date.outputs.date }}.json
          retention-days: 7
          if-no-files-found: error
      - name: Host newly generated pin images for verified Metricool queue
        shell: bash
        run: |
          git config user.name 'Whats For Eats Pin Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pinterest-daily-pins pinterest-publishing-ledger
          if ! git diff --cached --quiet; then
            git commit -m "Research-based original GPT Image food pins $(TZ=America/Detroit date +%Y-%m-%d)"
            # Dashboard status-sync commits can race with the publisher.
            # Rebase generated assets onto the newest main before each push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Nine original assets safely hosted; Metricool may now schedule."
                exit 0
              fi
              echo "Concurrent main update; retrying asset-only push (attempt $attempt/5)."
              sleep 3
            done
            echo "::error::GitHub asset push failed after five rebased attempts. Generated image artifact is preserved."
            exit 1
          else
            echo 'No new verified assets; no feed update or duplicate publication.'
          fi
