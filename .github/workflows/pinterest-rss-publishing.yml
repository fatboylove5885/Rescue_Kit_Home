name: What’s For Eats — daily Pinterest RSS pin creator
on:
  schedule:
    # Two UTC starts cover 07:00 Detroit across DST changes.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-whatsforeats-pinterest
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Only start on the scheduled Detroit morning
        id: localtime
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'run=yes' >> "$GITHUB_OUTPUT"
          elif [[ "$(TZ=America/Detroit date +%H)" == "07" ]]; then
            echo 'run=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'run=no' >> "$GITHUB_OUTPUT"
          fi
      - name: Generate photo-led Pins and update RSS feed
        if: steps.localtime.outputs.run == 'yes'
        run: python scripts/pinterest_publisher.py
      - name: Commit public image assets and feed changes
        if: steps.localtime.outputs.run == 'yes'
        shell: bash
        run: |
          git config user.name 'Whats For Eats Pin Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pinterest-daily-pins pinterest-rss.xml
          if ! git diff --cached --quiet; then
            git commit -m "Daily original photo pins + RSS update $(TZ=America/Detroit date +%Y-%m-%d)"
            git push origin HEAD:main
          else
            echo 'Already generated today; no duplicate feed update.'
          fi
