name: Pinterest RSS Safety Quarantine
on:
  push:
    branches: [main]
    paths: [pinterest-rss.xml, scripts/pinterest_publisher.py, scripts/pinterest_rss_quarantine.py, .github/workflows/pinterest-rss-quarantine.yml]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pinterest-rss-quarantine
  cancel-in-progress: false
jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify locked publisher and eliminate retired RSS items
        run: python scripts/pinterest_rss_quarantine.py
      - name: Save quarantine correction if needed
        shell: bash
        run: |
          git config user.name 'Pinterest RSS Safety Guard'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pinterest-rss.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore retired Pinterest RSS quarantine"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
