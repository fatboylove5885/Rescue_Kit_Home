name: "What's For Eats — Pinterest Command Center data sync"
on:
  schedule:
    - cron: '7 * * * *'
      timezone: 'America/Detroit'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pinterest-command-center.yml'
      - 'scripts/build_pinterest_command_center.py'
      - 'pinterest-command-center/index.html'
      - 'pinterest-research/**'
      - 'pinterest-daily-pins/**'
      - 'pinterest-publishing-ledger/**'
      - 'pinterest-scheduling-ledger/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: whatsforeats-pinterest-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python for audit compilation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build privacy-safe dashboard JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_pinterest_command_center.py
      - name: Commit refreshed public dashboard data
        shell: bash
        run: |
          git config user.name 'Pinterest Command Center Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pinterest-command-center/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Pinterest dashboard from verified activity and receipts"
            git push origin HEAD:main
          else
            echo "No dashboard changes."
          fi
