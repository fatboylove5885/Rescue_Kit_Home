name: "What's For Eats - Free PDF Product Promotion"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free-pdf-product-promo.yml"
  schedule:
    - cron: '19 5 * * 1'
permissions:
  contents: write
concurrency:
  group: wfe-free-pdf-promos
  cancel-in-progress: false
jobs:
  update-pdf-promotions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pypdf==6.1.3 reportlab==4.4.4 pymupdf==1.26.5
      - name: Add original dinner crossword puzzle if not already published
        run: |
          if [ ! -f pdfs/dinner-crossword-challenge.pdf ]; then
            python scripts/create_dinner_crossword.py
          fi
      - name: Add tasteful optional product page and verify links in every PDF
        run: python scripts/add_product_promos_to_free_pdfs.py
      - name: Render visually and verify promotional page links in all PDFs
        run: python scripts/render_pdf_promotional_preview.py
      - name: Publish PDF updates and audit receipt
        shell: bash
        run: |
          git config user.name 'Whats For Eats PDF Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pdfs/*.pdf pinterest-activity/free-pdf-product-promotion-audit.json pinterest-activity/pdf-promotion-visual-check.png
          if git diff --cached --quiet; then
            echo "All PDF promotions already in place."
            exit 0
          fi
          git commit -m "Add optional product recommendations to free PDF printables"
          for i in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "All free PDFs updated and published."
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          echo "::error::Could not commit PDF promotion updates"
          exit 1
