name: Pinterest Command Center — manual queue sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pinterest-publishing-ledger/**'
      - 'pinterest-research/**/manifest.json'
      - 'scripts/build_pinterest_manual_queue.py'
permissions:
  contents: write
concurrency:
  group: pinterest-manual-queue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify all nine real images and correct destination links before queue swap
        run: python scripts/build_pinterest_manual_queue.py
      - name: Save only verified ready-to-copy manual queue records
        shell: bash
        run: |
          git config user.name "Whats For Eats Manual Queue"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest-command-center/manual-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Pinterest Command Center with verified original image, SEO copy and URL"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
