<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-label="Weekly meal-planning roadmap: choose busy nights, assign simple dinners, reuse ingredients"><rect width="1200" height="555" fill="#F8EFE4"/><rect x="15" y="15" width="1170" height="525" rx="28" fill="none" stroke="#C98862" stroke-width="3"/><text x="600" y="105" font-family="Georgia,serif" font-size="51" font-weight="700" text-anchor="middle" fill="#37241D">Plan seven dinners in ten minutes</text><path d="M230 135 H970" stroke="#CE744A" stroke-width="4" stroke-linecap="round"/><g transform="translate(48 195)"><rect width="365" height="285" rx="25" fill="#FFF8EF" stroke="#E2BE9B" stroke-width="3"/><circle cx="51" cy="55" r="30" fill="#B93E22"/><text x="51" y="63" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text><text x="94" y="61" font-family="Arial" font-size="19" font-weight="700" fill="#8E3C25">1</text><text x="25" y="119" font-family="Arial" font-size="27" font-weight="900" fill="#32231B">MARK BUSY NIGHTS</text><foreignObject x="25" y="143" width="315" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 Arial;color:#33241D">Choose the nights with little time</div></foreignObject><foreignObject x="25" y="226" width="315" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.25 Arial;color:#70564B">Place easiest meals there</div></foreignObject></g><g transform="translate(438 195)"><rect width="365" height="285" rx="25" fill="#FCE6C7" stroke="#E2BE9B" stroke-width="3"/><circle cx="51" cy="55" r="30" fill="#B93E22"/><text x="51" y="63" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text><text x="94" y="61" font-family="Arial" font-size="19" font-weight="700" fill="#8E3C25">2</text><text x="25" y="119" font-family="Arial" font-size="27" font-weight="900" fill="#32231B">REUSE INGREDIENTS</text><foreignObject x="25" y="143" width="315" height="65"><div xmlns="http://www.