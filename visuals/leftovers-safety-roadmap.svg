<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-label="Cooked leftovers safety: refrigerate within two hours, use within three to four days, reheat to 165 degrees Fahrenheit"><rect width="1200" height="555" fill="#F8EFE4"/><rect x="15" y="15" width="1170" height="525" rx="28" fill="none" stroke="#C98862" stroke-width="3"/><text x="600" y="105" font-family="Georgia,serif" font-size="51" font-weight="700" text-anchor="middle" fill="#37241D">Cook once, store safely, eat again</text><path d="M230 135 H970" stroke="#CE744A" stroke-width="4" stroke-linecap="round"/><g transform="translate(48 195)"><rect width="365" height="285" rx="25" fill="#FFF8EF" stroke="#E2BE9B" stroke-width="3"/><circle cx="51" cy="55" r="30" fill="#B93E22"/><text x="51" y="63" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text><text x="94" y="61" font-family="Arial" font-size="19" font-weight="700" fill="#8E3C25">WITHIN 2 HOURS</text><text x="25" y="119" font-family="Arial" font-size="27" font-weight="900" fill="#32231B">CHILL PROMPTLY</text><foreignObject x="25" y="143" width="315" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 Arial;color:#33241D">Use shallow covered containers</div></foreignObject><foreignObject x="25" y="226" width="315" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.25 Arial;color:#70564B">Within 1 hour above 90°F</div></foreignObject></g><g transform="translate(438 195)"><rect width="365" height="285" rx="25" fill="#FCE6C7" stroke="#E2BE9B" stroke-width="3"/><circle cx="51" cy="55" r="30" fill="#B93E22"/><text x="51" y="63" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text><text x="94" y="61" font-family="Arial" font-size="19" font-weight="700" fill="#8E3C25">DAYS 1–4</text><text x="25" y="119" font-family="Arial" font-size="27" font-weight="900" fill="#32231B">EAT OR FREEZE</text><foreignObject x="25" y="143" width="315" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 Arial;color:#33241D">Date the label; rotate leftovers</div></foreignObject><foreignObject x="25" y="226" width="315" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.25 Arial;color:#70564B">Reheat leftovers to 165°F</div></foreignObject></g><g transform="translate(828 195)"><rect width="365" height="285" rx="25" fill="#FFF8EF" stroke="#E2BE9B" stroke-width="3"/><circle cx="51" cy="55" r="30" fill="#B93E22"/><text x="51" y="63" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text><text x="94" y="61" font-family="Arial" font-size="19" font-weight="700" fill="#8E3C25">LATER</text><text x="25" y="119" font-family="Arial" font-size="27" font-weight="900" fill="#32231B">THAW SAFELY</text><foreignObject x="25" y="143" width="315" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.35 Arial;color:#33241D">Refrigerator, cold water, microwave</div></foreignObject><foreignObject x="25" y="226" width="315" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.25 Arial;color:#70564B">Cook promptly after quick thaw</div></foreignObject></g><text x="600" y="518" text-anchor="middle" font-family="Arial" font-size="16" fill="#74594C">WHAT’S FOR EATS · PRACTICAL DINNER GUIDES</text></svg>